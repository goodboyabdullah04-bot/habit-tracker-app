name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate complete Android project scaffolding
        working-directory: habit_tracker_app
        run: |
          rm -rf android
          flutter create --platforms=android --org com.habittracker --project-name habit_tracker_app .

      - name: Get Flutter dependencies
        working-directory: habit_tracker_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: habit_tracker_app
        run: flutter build apk --release

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habit_Tracker_App_v1.0
          path: habit_tracker_app/build/app/outputs/**/app*release*.apk
          if-no-files-found: error
